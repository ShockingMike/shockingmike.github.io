  :root { --nga: #F6F4EE; --muc: #101A3A; --nhan: #2E3CFF; --u: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F4EE; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muc); }
  #san { position: fixed; inset: 0; overflow: hidden; background: #F6F4EE; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #canh, #canhTinh { position: absolute; left: 0; top: 0; display: block; object-fit: fill; }
  #canhTinh { visibility: hidden; }
  #coVid { position: absolute; left: 0; top: 0; width: 4px; height: 4px; opacity: .01; pointer-events: none; }
  #suong { position: absolute; pointer-events: none; }
  #co, #may { position: absolute; display: block; }
  #may { left: 0; top: 0; }
  
  .ui { position: absolute; z-index: 5; color: var(--muc); opacity: 0; }
  a, button { color: inherit; text-decoration: none; font: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--nhan); outline-offset: 4px; border-radius: 1px; }
  .nav a:focus-visible, .nav button:focus-visible { outline-color: var(--nga); }
  .nav { left: 0; top: 0; width: calc(100% / var(--u)); height: 84px; display: flex; align-items: center; padding: 0 48px; gap: 18px; color: var(--nga); transform: scale(var(--u)); transform-origin: 0 0; }
  .nav .logo { display: block; height: 24px; color: var(--nga); }
  .logo svg { display: block; height: 100%; width: auto; }
  .logo path { fill: currentColor; }
  .nav .mo { font-size: 13px; font-weight: 500; letter-spacing: .01em; padding-left: 16px; border-left: 1px solid currentColor; line-height: 1; padding-top: 3px; padding-bottom: 3px; white-space: nowrap; }
  .nav .menu { margin-left: auto; display: flex; gap: 30px; font-size: 14px; font-weight: 550; letter-spacing: .005em; white-space: nowrap; }
  .kbn { display: inline-flex; align-items: center; margin-left: 34px; height: 40px; padding: 0 38px 0 18px; font-size: 14px; font-weight: 620; letter-spacing: .01em; color: var(--nga); background: var(--nhan); white-space: nowrap;
         clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 50%, 100% 100%, 0 100%); }
  .kbn:focus-visible { clip-path: none; outline-offset: 3px; }
  .kF3 { left: 0; bottom: 0; width: calc(100% / var(--u)); display: flex; flex-direction: column; align-items: center; text-align: center; transform: translateX(var(--dx, 0px)) scale(var(--u)); transform-origin: 0 100%; }
  .kF3 .cau { margin: 0 0 32px; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; color: var(--muc); padding: 0 16px; }

    const imgOf = (blob) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(blob); });
    let hasCloth = false, coVideo = false, coIdx = 0, coNew = false, STATIC = false;
    pr.coTinh.then(async () => { const im = await imgOf(blobs.coTinh); if (!coVideo) { setStill(im); frameTick++; } hasCloth = true; });
    const fontOK = pr.font.then(async () => { const ff = new FontFace('Mona Sans', await blobs.font.arrayBuffer(), { weight: '200 900', stretch: '75% 125%' }); await ff.load(); document.fonts.add(ff); layout(); });
    const vco = document.createElement('video'); vco.id = 'coVid';

    const playing = (v, ms) => new Promise((ok) => {
      let done = false; const fin = (r) => { if (!done) { done = true; ok(r); } };

    const coOK = pr.co.then(async () => {
      vco.src = URL.createObjectURL(blobs.co);
      const ok = await playing(vco, 2500);
      if (!ok) { STATIC = true; return; }
      coVideo = true;
      if ('requestVideoFrameCallback' in vco) { const cb = (now, md) => { coIdx = Math.round(md.mediaTime * FPS) % LOOP; coNew = true; vco.requestVideoFrameCallback(cb); }; vco.requestVideoFrameCallback(cb); }
    });
    const tinhOK = pr.canhTinh.then(async () => { const u = URL.createObjectURL(blobs.canhTinh); canh.poster = u; tinh.src = u; await tinh.decode().catch(() => {}); });
    let canhReady = false;
    const toStatic = () => { STATIC = true; tinh.style.visibility = 'visible'; canh.style.visibility = 'hidden'; try { vco.pause(); canh.pause(); } catch (e) {} };
    const canhOK = Promise.all([pr.canh, coOK, tinhOK]).then(async () => {
      if (STATIC) { toStatic(); return; }
      if (YEU) canh.autoplay = false;
      canh.src = URL.createObjectURL(blobs.canh);
      const ok = YEU ? await new Promise((r) => { canh.addEventListener('loadeddata', () => r(true), { once: true }); setTimeout(() => r(canh.readyState >= 2), 2500); }) : await playing(canh, 2500);

      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      canhReady = true;
    });
    let t0 = performance.now(), last = t0, started = false, lastCT = -1, rateWant = 1;
    function tick(now) {
      const t = (now - t0) / 1000, dt = Math.min(0.1, (now - last) / 1000); last = now;
      const p = total ? Math.min(100, 100 * loaded / total) : 0;
      if (coVideo && !STATIC) {
        if ('requestVideoFrameCallback' in vco) { if (coNew) { unpack(vco); coNew = false; frameTick++; } }
        else if (vco.currentTime !== lastCT) { lastCT = vco.currentTime; coIdx = Math.round(lastCT * FPS) % LOOP; unpack(vco); frameTick++; }
      }
      const st = frame(t, dt, canhReady ? p : Math.min(p, 99.9), canhReady, coIdx, hasCloth);
      if (tDone != null && !started) {
        started = true;
        if (!STATIC) { canh.currentTime = (vco.currentTime + (YEU ? 0.35 + TR : 0)) % (LOOP / FPS); if (!YEU) canh.play().catch(() => {}); }
      }
      if (started && !STATIC && YEU && canh.paused && st.j >= TR * FPS) canh.play().catch(() => {});
      if (started && !STATIC && !canh.paused && st.done) {
        const L = LOOP / FPS, d = ((canh.currentTime - vco.currentTime + L * 1.5) % L) - L / 2;
        const want = Math.abs(d) > 0.12 ? (d > 0 ? 0.98 : 1.02) : Math.abs(d) < 0.03 ? 1 : rateWant;
        if (want !== rateWant) { rateWant = want; canh.playbackRate = want; }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  live();
})();
