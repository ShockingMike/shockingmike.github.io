<title>Bản xem riêng</title>
<style>html,body{margin:0;height:100%;background:#fdfbf6;font:14px/1.5 system-ui,sans-serif;color:#5a4632}p{position:fixed;inset:0;display:grid;place-items:center;margin:0;text-align:center;padding:24px}</style>
</head><body><p id="m"></p>
<script>
(async () => {
  const m = document.getElementById('m');
  const bytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const PHRASE = true;
  const k = PHRASE ? decodeURIComponent(location.hash.slice(1)) : new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) { m.textContent = 'Link thiếu mã mở. Hãy dùng đúng link đã được gửi.'; return; }
  try {
    const key = PHRASE
      ? await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes('MIkR3K43QnE-RsqMUiYIIQ'), iterations: 250000, hash: 'SHA-256' },
          await crypto.subtle.importKey('raw', new TextEncoder().encode(k), 'PBKDF2', false, ['deriveKey']),
          { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
      : await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes('1SphY1zCnlwLsegm') }, key, bytes(DATA));
    const { html, files } = JSON.parse(new TextDecoder().decode(plain));
    let page = html;
    for (const [name, f] of Object.entries(files)) {
      const blob = f.b64 ? new Blob([Uint8Array.from(atob(f.b64), (c) => c.charCodeAt(0))], { type: f.type }) : new Blob([f.text], { type: f.type });
      page = page.split('__BLOB_' + name + '__').join(URL.createObjectURL(blob));
    }
    const t = html.match(/<title>([^<]*)<\/title>/);
    document.open(); document.write(page); document.close();
    if (t) document.title = t[1];
  } catch (e) { m.textContent = 'Không mở được. Hãy dùng đúng link đã được gửi.'; }
})();
