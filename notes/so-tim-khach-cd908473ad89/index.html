<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sổ Tìm Khách</title>
<style>
  :root { color-scheme: light dark; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F3F4EF; color: #1C201D; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { body { background: #121512; color: #E7EAE3; } }
  .lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .lock form { width: min(420px, 100%); display: grid; gap: 12px; }
  .lock h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; }
  .lock p { font-size: 15px; opacity: 0.75; }
  .lock label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; margin-top: 6px; }
  .lock input { font: inherit; padding: 12px 14px; border: 1px solid currentColor; border-radius: 8px; background: transparent; color: inherit; }
  .lock button { font-family: inherit; font-size: 15px; font-weight: 600; padding: 12px 16px; border: 0; border-radius: 8px; background: #7B3F1E; color: #FBFBF8; cursor: pointer; }
  .lock .err { color: #B3261E; font-size: 14px; min-height: 22px; }
  @media (prefers-color-scheme: dark) { .lock .err { color: #F2B8B5; } }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="form">
    <h1>Sổ Tìm Khách</h1>
    <p>Trang riêng của Shocking Mike. Nhập mật khẩu để mở; máy này sẽ nhớ mật khẩu cho lần sau.</p>
    <label for="pass">Mật khẩu</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button type="submit" id="go">Mở sổ</button>
    <p class="err" id="err" role="status"></p>
  </form>
</div>
<div id="vault"></div>

  const CONFIG_BLOB = {"s":"T2x3RakDqwizGVLynpaYFA==","i":"VnFZPzp/QZOjn2Q1","c":"1ZSX3jJMi3Nb6CdDquLJ8wRjPqlXqFLZwGmpET5tOIeAG6DU2+rdQRO2i1VEo8iPDHfcPhJT6gLAosqOhy/zmsE260oCkrH31rpjXv4SRYvpSkRauIRimtdv6aPuPpvfqIBqQJ1dDGlA9yxp8+2idvqm09uxfxwv1AzFkXAWxCw9I6bNvqbznlV47JJjAaodFdALrae3prxUYv3jGRJ94k12N3/MW4+U2sOEmPL4Cd/Qso/K150=","it":250000};
  const SEED = {"done":{"w1-1":true,"w1-3":true,"w1-4":true,"w1-6":true,"p-1":true},"tally":{"sent":0,"replied":0,"quoted":0,"won":0},"savedAt":0};
  const LS_KEY = "so-tim-khach:v1";
  const PASS_KEY = "so-tim-khach:pass";
  const TALLY = ["sent", "replied", "quoted", "won"];
  const $ = (id) => document.getElementById(id);

  const bytes = (b64) => {
    const bin = atob(b64.replace(/\s+/g, ""));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  const toB64 = (text) => btoa(String.fromCharCode(...new TextEncoder().encode(text)));
  const fromB64 = (b64) => new TextDecoder().decode(bytes(b64));

  async function keyFrom(pass, saltB64, iterations) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(saltB64), iterations, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
    );
  }
  async function open(blob, pass) {
    const key = await keyFrom(pass, blob.s, blob.it);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(blob.i) }, key, bytes(blob.c));
    return new TextDecoder().decode(plain);
  }

  /* ---------- State ---------- */
  function normalize(raw) {
    const out = { done: {}, tally: { sent: 0, replied: 0, quoted: 0, won: 0 }, savedAt: 0 };
    if (!raw || typeof raw !== "object") return out;
    if (raw.done && typeof raw.done === "object") {
      for (const k of Object.keys(raw.done)) if (raw.done[k] === true && /^[a-z0-9-]{1,12}$/.test(k)) out.done[k] = true;
    }
    if (raw.tally && typeof raw.tally === "object") {
      for (const k of TALLY) {
        const n = Math.floor(Number(raw.tally[k]));
        out.tally[k] = Number.isFinite(n) && n > 0 ? Math.min(n, 9999) : 0;
      }
    }
    const t = Number(raw.savedAt);
    out.savedAt = Number.isFinite(t) && t > 0 ? t : 0;
    return out;
  }

  let state = normalize(SEED);
  let cfg = null;          // { repo, path, token } once unlocked
  let sha = null;          // current file sha on GitHub
  let syncTimer = 0;
  let pushing = false;
  let dirty = false;

  function readLocal() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* storage off */ }
  }

  /* ---------- GitHub sync ---------- */
  const api = () => "https://api.github.com/repos/" + cfg.repo + "/contents/" + cfg.path;
  const headers = () => ({ Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });

  async function pull() {
    const res = await fetch(api() + "?ref=HEAD&t=" + Date.now(), { headers: headers(), cache: "no-store" });
    if (res.status === 404) { sha = null; return null; }
    if (!res.ok) throw new Error("GET " + res.status);
    const json = await res.json();
    sha = json.sha;
    return normalize(JSON.parse(fromB64(json.content)));
  }

  async function push() {
    const body = { message: "Progress " + new Date().toISOString().slice(0, 16).replace("T", " "), content: toB64(JSON.stringify(state, null, 1)) };
    if (sha) body.sha = sha;
    const res = await fetch(api(), { method: "PUT", headers: headers(), body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
    if (!res.ok) throw new Error("PUT " + res.status);
    sha = (await res.json()).content.sha;
  }

  function setSync(kind, extra) {
    const row = $("save-status");
    if (!row) return;
    row.dataset.state = kind;
    const map = {
      loading: "Đang tải tiến độ…",
      saving: "Đang lưu…",
      saved: "Đã lưu, đồng bộ mọi máy" + (extra ? " · " + extra : ""),
      local: "Chưa nối được mạng, lưu tạm trên máy này",
      off: "Lưu trên máy này",
    };
    const text = $("sync-text");
    if (text) text.textContent = map[kind] || kind;
    const retry = $("sync-retry");
    if (retry) retry.hidden = kind !== "local";
  }

  async function syncNow() {
    if (!cfg || pushing) return;
    pushing = true;
    setSync("saving");
    try {
      await push();
      dirty = false;
      setSync("saved", new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }));
    } catch (err) {
      if (err && err.conflict) {
        try {
          const remote = await pull();
          if (remote && remote.savedAt > state.savedAt) { state = remote; writeLocal(); render(); }
          await push();
          dirty = false;
          setSync("saved", new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }));
        } catch (e2) { setSync("local"); }
      } else {
        setSync("local");
      }
    }
    pushing = false;
  }

  function scheduleSync() {
    if (!cfg) return;
    dirty = true;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 1200);
  }

  /* ---------- The plan ---------- */
  function stageFor(pct) {
    if (pct === 0) return "Hạt xanh";
    if (pct < 25) return "Giai đoạn sấy";
    if (pct < 50) return "Chuyển vàng";
    if (pct < 75) return "Nổ lần một";
    if (pct < 100) return "Phát triển";
    return "Ra mẻ";
  }

  let taskInputs = [], trackInputs = [], weeks = [], leadInputs = [];

  function render() {
    for (const input of taskInputs.concat(trackInputs, leadInputs)) input.checked = state.done[input.id] === true;
    const done = taskInputs.filter((i) => i.checked).length;
    const total = taskInputs.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    $("pct").textContent = String(pct);
    $("roast-bar").style.setProperty("--p", pct + "%");
    $("roast-bar").setAttribute("aria-valuenow", String(pct));
    $("stage").textContent = stageFor(pct);
    $("done-count").textContent = String(done);
    $("total-count").textContent = String(total);
    $("track-count").textContent = String(trackInputs.filter((i) => i.checked).length);
    for (const out of document.querySelectorAll("[data-lead-count]")) {
      const scope = document.getElementById(out.getAttribute("data-lead-count"));
      const boxes = scope ? Array.from(scope.querySelectorAll("input[data-lead]")) : [];
      out.textContent = String(boxes.filter((b) => b.checked).length);
    }

    let currentFound = false;
    for (const week of weeks) {
      const boxes = Array.from(week.querySelectorAll("input[data-task]"));
      const allDone = boxes.length > 0 && boxes.every((b) => b.checked);
      const isCurrent = !allDone && !currentFound;
      if (isCurrent) currentFound = true;
      week.classList.toggle("is-done", allDone);
      week.classList.toggle("is-current", isCurrent);
      const pill = week.querySelector(".week-pill");
      pill.hidden = !(allDone || isCurrent);
      pill.textContent = allDone ? "Xong" : "Đang làm";
    }

    for (const key of TALLY) $("tally-" + key).textContent = String(state.tally[key]);
    const sent = state.tally.sent;
    $("reply-rate").textContent = sent > 0 ? Math.round((Math.min(state.tally.replied, sent) / sent) * 100) + "%" : "—";
  }

  function touch() {
    state.savedAt = Date.now();
    writeLocal();
    render();
    scheduleSync();
  }

  function buildStatusRow() {
    const row = $("save-status");
    if (!row) return;
    row.innerHTML = "";
    const wrap = document.createElement("span");
    wrap.className = "save-text";
    const dot = document.createElement("span");
    dot.className = "save-dot";
    const text = document.createElement("span");
    text.id = "sync-text";
    wrap.append(dot, text);
    const retry = document.createElement("button");
    retry.type = "button";
    retry.id = "sync-retry";
    retry.className = "save-btn";
    retry.textContent = "Thử lại";
    retry.hidden = true;
    retry.addEventListener("click", syncNow);
    const code = document.createElement("button");
    code.type = "button";
    code.className = "save-btn";
    code.textContent = "Chép mã tiến độ";
    code.addEventListener("click", () => {
      const value = toB64(JSON.stringify(state));
      const done = () => { code.textContent = "Đã chép"; setTimeout(() => { code.textContent = "Chép mã tiến độ"; }, 2000); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(value).then(done, () => window.prompt("Mã tiến độ:", value));
      else window.prompt("Mã tiến độ:", value);
    });
    row.append(wrap, retry, code);
  }

  function copyText(el) {
    const text = el.textContent;
    const fallback = () => {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (ok) sel.removeAllRanges();
      return ok;
    };
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
    return Promise.resolve(fallback());
  }

  async function start() {
    taskInputs = Array.from(document.querySelectorAll("input[data-task]"));
    trackInputs = Array.from(document.querySelectorAll("input[data-track]"));
    leadInputs = Array.from(document.querySelectorAll("input[data-lead]"));
    weeks = Array.from(document.querySelectorAll(".week"));

    const local = readLocal();
    if (local) {
      const l = normalize(local);
      if (l.savedAt >= state.savedAt) state = l;
    }
    buildStatusRow();
    render();

    document.addEventListener("change", (e) => {
      const input = e.target;
      if (!(input instanceof HTMLInputElement)) return;
      if (!input.hasAttribute("data-task") && !input.hasAttribute("data-track") && !input.hasAttribute("data-lead")) return;
      if (input.checked) state.done[input.id] = true;
      else delete state.done[input.id];
      touch();
    });

    document.addEventListener("click", (e) => {
      const target = e.target instanceof Element ? e.target : null;
      if (!target) return;
      const step = target.closest("[data-tally]");
      if (step) {
        const key = step.getAttribute("data-tally");
        const next = state.tally[key] + Number(step.getAttribute("data-step"));
        state.tally[key] = Math.max(0, Math.min(9999, next));
        touch();
        return;
      }
      const copyBtn = target.closest("[data-copy]");
      if (copyBtn) {
        const source = $(copyBtn.getAttribute("data-copy"));
        if (!source) return;
        copyText(source).then((ok) => {
          copyBtn.textContent = ok ? "Đã chép" : "Đã chọn chữ, nhấn Ctrl+C";
          setTimeout(() => { copyBtn.textContent = "Sao chép"; }, 2200);
        });
      }
    });

    if (!cfg) { setSync("off"); return; }

    // First load: take whichever copy is newer, then keep them together.
    setSync("loading");
    try {
      const remote = await pull();
      if (remote && remote.savedAt > state.savedAt) {
        state = remote;
        writeLocal();
        render();
        setSync("saved");
      } else if (!remote || state.savedAt > remote.savedAt) {
        await syncNow();
      } else {
        setSync("saved");
      }
    } catch (err) {
      setSync("local");
    }

    // Pick up changes made on another machine.
    window.addEventListener("focus", async () => {
      if (!cfg || dirty || pushing) return;
      try {
        const remote = await pull();
        if (remote && remote.savedAt > state.savedAt) { state = remote; writeLocal(); render(); setSync("saved"); }
      } catch (e) { /* offline is fine */ }
    });
  }

  function mount(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    for (const el of Array.from(doc.head.children)) {
      if (el.tagName !== "TITLE") document.head.appendChild(el);
    }
    const vault = $("vault");
    for (const el of Array.from(doc.body.children)) vault.appendChild(el);
    const lock = $("lock");
    if (lock) lock.remove();
    start();
  }

  async function tryPass(pass, remember) {
    const html = await open(PAYLOAD, pass);
    if (CONFIG_BLOB) {
      try { cfg = JSON.parse(await open(CONFIG_BLOB, pass)); } catch (e) { cfg = null; }
    }
    if (remember) { try { localStorage.setItem(PASS_KEY, pass); } catch (e) { /* storage off */ } }
    mount(html);
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = $("pass").value;
    $("err").textContent = "";
    $("go").disabled = true;
    $("go").textContent = "Đang mở…";
    try {
      await tryPass(pass, true);
    } catch (err) {
      $("err").textContent = "Mật khẩu không đúng.";
      $("go").disabled = false;
      $("go").textContent = "Mở sổ";
      $("pass").select();
    }
  });

  let saved = null;
  try { saved = localStorage.getItem(PASS_KEY); } catch (e) { saved = null; }
  if (saved) {
    tryPass(saved, false).catch(() => {
      try { localStorage.removeItem(PASS_KEY); } catch (e) { /* ignore */ }
    });
  }
})();
</script>
</body>
</html>
