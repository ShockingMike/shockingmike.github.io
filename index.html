<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shocking Mike · Design Engineer</title>
<meta name="description" content="Portfolio of Shocking Mike, a Design Engineer who designs and builds expressive landing pages. Have a look around.">
<meta name="theme-color" content="#F6F5F1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1A18'/%3E%3Cpath fill='%23F6F5F1' d='M14 48V16h8l10 16 10-16h8v32h-7V29l-11 17-11-17v19z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #F6F5F1;
    --text: #1A1A18;
    --muted: #4A4A45;
    --rule: #D9D7CF;
    --accent: #2F4BD8;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: clamp(28px, 6vw, 72px) clamp(20px, 5vw, 40px) 64px; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .site { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
  .site__name { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  main { padding-top: clamp(56px, 12vw, 128px); }
  h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1.04; font-weight: 650; letter-spacing: -.025em; }
  .intro { margin: 20px 0 0; max-width: 32ch; font-size: clamp(20px, 2.4vw, 24px); line-height: 1.4; color: var(--muted); }
  .projects { list-style: none; margin: clamp(56px, 10vw, 104px) 0 0; padding: 0; border-top: 1px solid var(--rule); }
  .project { display: grid; gap: 8px; padding: 28px 0 32px; border-bottom: 1px solid var(--rule); }
  .project h2 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
  .project p { margin: 0; max-width: 46ch; color: var(--muted); }
  .project a {
    justify-self: start; margin-top: 8px; padding: 4px 0;
    color: var(--text); font-weight: 600;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px;
  }
  .project a:hover { color: var(--accent); text-decoration-thickness: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <p class="site__name">Shocking Mike</p>
    </header>
    <main>
      <h1>Hi, I’m Mike.</h1>
      <p class="intro">As a Design Engineer, I design and build expressive landing pages that feel good to use.</p>
      <ul class="projects">
        <li class="project">
          <h2 id="project-kern">Kern Society</h2>
          <p>A concept identity and landing page for a fictional type foundry. Go play with the fonts.</p>
          <a href="kern-society/" aria-describedby="project-kern">See it live →</a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
